[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sa-geospatial-feature-etl"
version = "0.1.0"
description = "ETL pipeline for SA geospatial planning and cadastre data via ArcGIS REST APIs"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "tenacity>=8.0",
    "pydantic>=2.7,<2.11",
    "pydantic-settings>=2.4,<2.6",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "click>=8.1",
    "loguru>=0.7",
]

[project.scripts]
sa-etl = "sa_etl.pipeline:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_etl"]
